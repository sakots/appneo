<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>appneo Local Test</title>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, sans-serif;
        background: #f4f4f4;
        color: #222;
      }

      main {
        margin: 0 auto;
      }

      .test-panel {
        padding: 14px;
        border: 1px solid #bbb;
        background: #fff;
      }

      .test-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }

      input[type="number"] {
        width: 5em;
      }

      button,
      input[type="button"] {
        padding: 4px 10px;
        cursor: pointer;
      }

      .preview-log {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      .preview-log img {
        max-width: 300px;
        border: 1px solid #999;
        background: #fff;
      }

      .note {
        font-size: 13px;
        color: #555;
      }

      #appneo-root {
        width: max-content !important;
        max-width: none !important;
      }

      #appneo-root .appneo-container {
        display: flex !important;
        flex-flow: row nowrap !important;
        align-items: flex-start !important;
        justify-content: center !important;
      }

      #appneo-root .appneo-stage,
      #appneo-root .appneo-palette {
        flex: 0 0 auto !important;
      }
    </style>
    <script>
      window.APPNEO_AUTO_START = false;
      window.APPNEO_NEO_BASE = new URL("../neo/dist/", location.href).href;

      document.paintBBSCallback = function (message) {
        if (message !== "check" || !window.Neo || !Neo.painter) return true;

        const log = document.getElementById("preview-log");
        const image = Neo.painter.getImage();
        const img = document.createElement("img");
        img.src = image.toDataURL("image/png");
        img.alt = "Saved canvas preview";

        const item = document.createElement("div");
        item.appendChild(img);

        try {
          const animation = Neo.painter.getThumbnail("animation");
          const link = document.createElement("a");
          link.href = URL.createObjectURL(animation);
          link.download = `${Date.now()}.pch`;
          link.textContent = "Download animation";
          item.appendChild(document.createElement("br"));
          item.appendChild(link);
        } catch (error) {
          console.warn("Animation export failed", error);
        }

        log.prepend(item);
        return false;
      };
    </script>
    <script src="../appneo.js" charset="UTF-8"></script>
    <script>
      const getParam = (name, fallback) => {
        const value = new URLSearchParams(location.search).get(name);
        return value || fallback;
      };

      window.addEventListener("DOMContentLoaded", () => {
        const width = document.querySelector("input[name='picw']");
        const height = document.querySelector("input[name='pich']");
        width.value = getParam("w", "300");
        height.value = getParam("h", "300");

        document.getElementById("start-appneo").addEventListener("click", (event) => {
          event.preventDefault();
          window.appneoStart();
        });
      });
    </script>
  </head>
  <body>
    <main>
      <h1>appneo Local Test</h1>

      <form class="test-panel" action="./" method="post">
        <p class="note">
          This page loads <code>../appneo.js</code> and starts PaintBBS NEO with local files.
        </p>

        <div class="test-row">
          Canvas:
          <input type="number" name="picw" min="50" max="2000" value="300">
          x
          <input type="number" name="pich" min="50" max="2000" value="300">
          <input id="start-appneo" type="button" value="お絵かきする">
        </div>
      </form>

      <applet-dummy name="paintbbs" width="400" height="460">
        <param name="url_save" value="paintpost.php">
        <param name="url_exit" value="./index.html">
        <param name="thumbnail_type" value="animation">
        <param name="neo_show_right_button" value="true">
        <param name="neo_disable_grid_touch_move" value="true">
        <param name="neo_disable_turn_original_glitch" value="true">
        <param name="neo_enable_zoom_out" value="true">
      </applet-dummy>

      <section class="preview-log" id="preview-log" aria-live="polite"></section>
    </main>
  </body>
</html>
